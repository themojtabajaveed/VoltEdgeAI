execution:
  dry_run: true
  max_trades_per_day: 5
  per_trade_risk_inr: 100000
  max_open_positions: 5
  conviction_threshold: 70
  live_order_tag: "VOLTEDGE_AUTO"
  eod_squareoff_time_ist: "15:15"
  live_startup_countdown: 10

# ── Conviction engine additive adjustments ────────────────────────────────
# Applied AFTER the weighted 5-layer sum in _compute_conviction().
# These are on top of the scanner-stamped conviction_modifier (which already
# packs freshness bonus + L4 market-confirmation bonus/penalty).
conviction:
  filing_metadata:
    high_quality_conviction_bonus: 6     # event_quality_score ≥ 80 → +6
    low_quality_conviction_penalty: 15   # event_quality_score < 55 → -15 (defensive)
    apply_enabled: true                  # master flag to disable the adjustment

router:
  dawn_confidence_min: 0.85
  hydra_confidence_min: 0.0
  router_enabled: true

  # ── 4-Layer Event Evaluation Model ─────────────────────────────────────
  # Replaces naive wall-clock staleness with market-time exposure + price-
  # reaction gating. See src/utils/filing_freshness.py.
  filing_freshness:
    pristine_market_minutes: 0         # 0 NSE session minutes → PRISTINE (maximal edge)
    fresh_market_minutes_max: 30       # 1..30 market-min → FRESH
    warm_market_minutes_max: 90        # 31..90 market-min → WARM (harder TA gate)
    price_reaction_fresh_pct: 1.0      # FRESH stocks reacting >1% → demote to STALE
    price_reaction_warm_pct: 2.0       # WARM stocks reacting >2% → demote to STALE
    pristine_conviction_bonus: 8       # conviction boost for PRISTINE filings
    fresh_conviction_bonus: 4          # conviction boost for FRESH filings
    warm_conviction_bonus: 0           # no boost for WARM (neutral)

  # Event quality scoring — Layer 3 of the 4-layer model.
  # See src/utils/event_quality.py for component math.
  event_quality:
    min_passing_score: 55              # filings scoring <55/100 → discarded before routing
    weight_event_type: 0.35            # event magnitude (category → score table)
    weight_deal_size_ratio: 0.25       # deal_size / market_cap tiers
    weight_earnings_surprise: 0.20     # surprise % tiers (non-results → neutral 50)
    weight_sector_followthrough: 0.10  # pattern_db historical follow-through 0.0-1.0
    weight_repetition_penalty: 0.10    # same symbol+category within lookback → penalty
    repetition_lookback_days: 5        # window for counting recent same-category filings
    low_quality_conviction_penalty: 15 # penalty applied when passes_quality_gate=False

  # Market confirmation — Layer 4 of the 4-layer model. Intraday HYDRA
  # injection path: ask the tape whether the market is actually reacting
  # before letting a filing add risk. See src/utils/event_quality.py.
  market_confirmation:
    min_market_minutes_before_check: 15  # PRISTINE filings skip L4 (TOO_EARLY → inject)
    volume_spike_multiplier: 2.0         # current 15m vol must exceed 20d avg × this
    min_price_velocity_pct: 0.5          # |price move %| needed in the L4 window
    indifferent_conviction_penalty: 20   # penalty when market has had time but shows nothing
    confirmed_conviction_bonus: 10       # bonus when tape confirms the filing

dawn:
  pre_market_scan_enabled: true
  scan_time_ist: "08:30"
  select_time_ist: "08:45"

hydra:
  scan_time_ist: "08:15"
  shadows_persist: true
  shadows_dir: "data/"

market:
  open_time_ist: "09:15"
  close_time_ist: "15:30"
  intraday_interval_minutes: 15

reporting:
  post_market_report_enabled: true
  router_performance_section: true
  email_enabled: true

logging:
  conviction_gate_log: true
  router_filter_log: true
  dry_run_log: true

counterfactual:
  target_pct: 2.0
  sl_pct: -1.5
  auto_run_post_market: true

backtest:
  default_days: 90
  target_pct: 2.0        # 2% profit target
  sl_pct: 1.5            # stop loss % (positive number, applied as -sl_pct)
  throttle_seconds: 0.35 # sleep between Kite API calls
  auto_run_weekly: false  # if true, runner.py triggers backtest every Friday
  slippage_entry_bps: 6
  slippage_exit_target_bps: 5
  slippage_exit_stop_bps: 10
  slippage_exit_neutral_bps: 3

# ── Phase 8: Unified stop-loss system ─────────────────────────────────────
# ExitEngine reads per-strategy params off Position.strategy_config (set at
# entry time). All strategies pass through the same engine — differentiation
# is config-driven, not code-branched.
stoploss:
  # Daily circuit breakers (multipliers of execution.per_trade_risk_inr)
  daily_loss_halt_multiplier: 3.0       # halt new entries when daily_pnl ≤ -3× per-trade risk
  daily_loss_flatten_multiplier: 5.0    # flatten all open positions at -5× per-trade risk

  # Position-level hard cap on stop distance (% of LTP)
  max_stop_pct: 2.5

  # Conviction-weighted stop adjustment applied at entry
  conviction_modifiers:
    high_threshold: 85
    high_multiplier: 1.2                # wider stop for high conviction (let trade breathe)
    low_threshold: 75
    low_multiplier: 0.8                 # tighter stop for lower conviction

  by_strategy:
    DAWN:
      initial_atr_multiplier: 1.5
      orb_stop_enabled: true            # use max(ORB low, atr stop) once 09:30 bar closes
      breakeven_r: 1.0
      trail_atr_settle: 2.0
      trail_atr_confirm: 1.5
      trail_atr_lock: 1.2
      trail_atr_accelerate: 0.75
      partials_enabled: true
      partial_1_r: 1.5
      partial_1_pct: 0.50
      partial_2_r: 2.5
      partial_2_pct: 0.25
      time_stop_ist: "15:20"            # Phase-8 rollout default; flip to 13:30 after 1 week stable
      rr_target: 2.5
    HYDRA:
      initial_atr_multiplier: 1.2
      orb_stop_enabled: false
      breakeven_r: 1.0
      trail_atr_settle: 2.0
      trail_atr_confirm: 1.5
      trail_atr_lock: 1.0
      trail_atr_accelerate: 0.75
      partials_enabled: true
      partial_1_r: 1.5
      partial_1_pct: 0.50
      partial_2_r: 2.5
      partial_2_pct: 0.25
      time_stop_ist: "15:20"            # Phase-8 rollout default; flip to 12:30 after 1 week stable
      rr_target: 1.8
    VIPER:
      initial_atr_multiplier: 1.5
      orb_stop_enabled: false
      breakeven_r: 1.0
      trail_atr_settle: 2.0
      trail_atr_confirm: 1.5
      trail_atr_lock: 1.0
      trail_atr_accelerate: 0.75
      partials_enabled: true
      partial_1_r: 2.0                  # matches legacy VIPER_PARTIAL_1_R (no regression)
      partial_1_pct: 0.50
      partial_2_r: 3.0                  # matches legacy VIPER_PARTIAL_2_R
      partial_2_pct: 0.25
      time_stop_ist: "15:20"
      rr_target: 2.5
